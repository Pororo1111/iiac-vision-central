# Docker Compose 2.24.4 이상. 실제 인증서·도메인 설정 후 사용.
services:
  backend:
    environment:
      COOKIE_SECURE: 'true'
  nginx:
    ports: !override
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR required}:/etc/nginx/certs:ro
