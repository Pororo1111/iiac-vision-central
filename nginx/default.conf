# HTTP upstream is loopback-only; Tailscale Serve supplies the external scheme.
map $http_x_forwarded_proto $central_scheme {
    default $scheme;
    https https;
}
resolver 127.0.0.11 valid=10s ipv6=off;
upstream central_api {
    zone central_api 64k;
    server backend:8080 resolve;
}
upstream central_web {
    zone central_web 64k;
    server frontend:3000 resolve;
}
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_central;
        proxy_pass http://central_api;
    }
    location ^~ /internal/ { return 404; }
    location = /api/iot/training-samples {
        client_max_body_size 11m;
        include /etc/nginx/proxy_params_central;
        proxy_pass http://central_api;
    }
    location = /api/training/uploads {
        client_max_body_size 210m;
        include /etc/nginx/proxy_params_central;
        proxy_pass http://central_api;
    }
    location = /api/training/imports/video {
        client_max_body_size 510m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        include /etc/nginx/proxy_params_central;
        proxy_pass http://central_api;
    }
    location ^~ /api/training/ {
        client_max_body_size 512k;
        include /etc/nginx/proxy_params_central;
        proxy_pass http://central_api;
    }
    location /api/ {
        include /etc/nginx/proxy_params_central;
        proxy_pass http://central_api;
    }
    location / {
        proxy_pass http://central_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $central_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
